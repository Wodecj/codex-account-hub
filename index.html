<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Codex Account Hub</title></head><body><img id="background-image" hidden alt="" aria-hidden="true"><main><div class="heading"><div><div class="eyebrow">CODEX CLI</div><h1>账号管理</h1><p>在独立环境中管理账号，查看订阅额度。</p></div><div class="heading-actions"><button id="open-settings" class="outline" type="button">⚙ 设置</button><button id="refresh-all" class="outline">↻ 刷新全部额度</button></div></div><dialog id="settings-dialog" aria-labelledby="settings-title"><div class="settings-head"><div><h2 id="settings-title">应用设置</h2><p>管理刷新频率与背景外观</p></div><button id="close-settings" type="button" class="outline" aria-label="关闭设置">✕</button></div><div class="settings-content"><h3>额度刷新</h3><div class="settings-section"><label class="settings-item" for="auto-refresh"><span><strong>启动时自动刷新全部账号额度</strong><small>打开软件后查询所有账号</small></span><input type="checkbox" id="auto-refresh" disabled></label><label class="settings-item" for="refresh-interval"><span><strong>自动刷新频率</strong><small>后台运行时定期查询</small></span><select id="refresh-interval" disabled><option value="0">禁用</option><option value="5">5 分钟</option><option value="10">10 分钟</option><option value="20">20 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option></select></label></div><h3>背景</h3><div class="settings-section"><div class="settings-item"><span><strong>背景图片</strong><small>选择本机图片作为软件背景</small></span><div class="setting-buttons"><button id="choose-bg" class="outline" type="button">选择图片</button><button id="reset-bg" class="outline" type="button">恢复默认</button></div></div><label class="settings-item" for="background-fit"><span><strong>显示方式</strong></span><select id="background-fit"><option value="cover">填充</option><option value="contain">完整显示</option><option value="stretch">拉伸</option></select></label><label class="settings-item mask-item" for="background-opacity"><span><strong>背景遮罩浓度 <output id="background-value">70%</output></strong><small>0% 不遮挡，100% 完全遮住图片</small></span><input id="background-opacity" type="range" min="0" max="100" step="5" value="70"></label></div><p id="settings-message" role="status" aria-live="polite"></p></div></dialog><div class="toolbar"><div><strong>账号列表</strong> <span id="count" class="count">0</span></div><form id="form"><label class="sr-only" for="name">账号名称</label><input id="name" maxlength="60" placeholder="输入账号名称" required><button type="submit" class="primary">＋ 添加账号</button></form></div><div id="message" role="status" aria-live="polite"></div><div id="profiles"></div></main><script src="renderer.js"></script></body></html>
